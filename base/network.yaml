apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ai-slash
spec:
  redirectRegex:
    regex: '^(https?://[^/]+/ai)(\?.*)?$'
    replacement: '${1}/${2}'
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ai-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /ai
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-lan
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ai-lan-ai-slash@kubernetescrd,ai-lan-ai-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /ai
            pathType: Prefix
            backend: {service: {name: gateway, port: {number: 8000}}}
