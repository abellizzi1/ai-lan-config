apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-lan
resources:
  - namespace.yaml
  - postgres.yaml
  - gateway.yaml
  - network.yaml
configMapGenerator:
  - name: gateway-config
    literals:
      - provider-api-base=https://api.openai.com/v1
      - default-model=gpt-4o-mini
